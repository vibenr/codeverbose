[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "codeverbose"
version = "0.1.0"
description = "Measure and compare code verbosity between AI-assisted and human-written code in any git repo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vaibhav Chauhan" }]
keywords = ["ai", "code-quality", "metrics", "verbosity", "llm", "static-analysis", "git"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
ai = ["anthropic>=0.25"]

[project.scripts]
codeverbose = "codeverbose.cli:main"

[project.urls]
Homepage = "https://github.com/vibenr/codeverbose"
Issues = "https://github.com/vibenr/codeverbose/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codeverbose"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B023"]
